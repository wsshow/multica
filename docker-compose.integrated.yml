name: multica-integrated
services:
  app:
    image: ${INTEGRATED_IMAGE:?Set INTEGRATED_IMAGE to your published image with a version tag or digest}
    env_file:
      - path: ${INTEGRATED_ENV_FILE:-.env.integrated}
        format: raw
    ports:
      - "${INTEGRATED_BIND_ADDRESS:-127.0.0.1}:${INTEGRATED_HOST_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: ${INTEGRATED_STOP_GRACE_PERIOD:-75s}
    tmpfs:
      - /tmp:mode=1777,size=268435456
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
