name: "Feature Request"
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      description: How are you running this customized edition? Include the customized source revision or artifact tag.
      options:
        - Customized Docker / Kubernetes deployment
        - Customized Desktop client
        - Local source development
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: >-
        Which part of the customized edition is affected? Report it to this
        repository or your deployment maintainer. Include the configured API/web
        deployment and the customized source revision; do not include credentials.
      options:
        - Web app
        - Desktop app
        - Mobile app (iOS)
        - CLI
        - Agents and runtimes
        - Issues, projects and workspaces
        - Chat integration — Feishu / Lark or Slack
        - Chat integration — DingTalk (community-maintained)
        - Chat integration — WeCom (community-maintained)
        - Chat integration — Telegram (community-maintained)
        - Self-hosting and deployment
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What do you want and why?
      description: Describe the problem you're trying to solve or the improvement you'd like to see.
      placeholder: |
        I'm trying to do X but there's no way to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution (optional)
      description: If you have an idea for how this should work, describe it here.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / mockups (optional)
      description: If applicable, add screenshots, mockups, or sketches to illustrate your idea.
