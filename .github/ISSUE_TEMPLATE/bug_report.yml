name: "Bug Report"
description: Report a bug — something that's broken, crashes, or behaves incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      description: How are you running this customized edition? Include the customized source revision or artifact tag.
      options:
        - Customized Docker / Kubernetes deployment
        - Customized Desktop client
        - Local source development
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: >-
        Which part of the customized edition is affected? Report it to this
        repository or your deployment maintainer. Include the configured API/web
        deployment and the customized source revision; do not include credentials.
      options:
        - Web app
        - Desktop app
        - Mobile app (iOS)
        - CLI
        - Agents and runtimes
        - Issues, projects and workspaces
        - Chat integration — Feishu / Lark or Slack
        - Chat integration — DingTalk (community-maintained)
        - Chat integration — WeCom (community-maintained)
        - Chat integration — Telegram (community-maintained)
        - Self-hosting and deployment
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead. Screenshots, error messages, or screen recordings are welcome.
      placeholder: |
        When I do X, Y happens. I expected Z instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: If applicable, add screenshots or screen recordings to help explain the problem.

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Environment info, logs, or anything else that might help.
      render: shell
