version: 2

project_name: multica

release:
  # Keep stable update clients on the previous complete release until the
  # shared promotion workflow has verified every platform's artifacts.
  make_latest: false
  # GitHub rejects duplicate asset names with 422. On a same-tag rerun,
  # replace only the matching CLI artifact and retry the upload; unrelated
  # release assets (for example manually published macOS builds) stay intact.
  replace_existing_artifacts: true
  header: |
    ## 本次更新

    {{ .Tag }} 新增个人部署入口，使用现有的 v0.11.1 源码基线和 CLI 功能兼容版本。

    ### 主要变化

    - **个人一键部署**：中文脚本默认安装最新稳定版。PostgreSQL 自动启动，附件与密钥保存在本地。按需接入自己的 PostgreSQL 或 S3。
    - **账号密码登录**：输入终端里的一次性初始化码，创建管理员和默认个人工作区。Web 和桌面端无需配置邮件服务。
    - **桌面首次连接**：输入一个一体化服务地址即可保存连接配置。
    - **备份和升级**：将默认数据库、附件和密钥保存到同一份归档。升级时可先备份、直接升级或取消。

    ### 升级须知

    - 已有外部服务部署可按原方式升级。切换到个人部署时，先备份数据库、附件和密钥，再安排数据迁移。
    - 一键安装入口在本版成为 Latest 后开放。浏览器默认访问 `http://localhost:8080`。

    ### 下载与部署

    - CLI：macOS、Linux、Windows，均提供 AMD64 / ARM64。
    - 桌面客户端：Linux（AppImage、DEB、RPM）和 Windows（EXE），提供 x64 / ARM64；本次不包含 macOS 桌面安装包。
    - 一体化镜像：`fkteams/multica:{{ .Version }}`，支持 Linux AMD64 / ARM64；稳定版同时更新 `latest`。

    安装包及校验文件见本页附件。更多内容见[中文部署说明](https://github.com/wsshow/multica/blob/{{ .Tag }}/docs/integrated-image.zh.md)和[源码版本映射](https://github.com/wsshow/multica/blob/{{ .Tag }}/docs/version-mapping.md)。

    <details>
    <summary>完整提交记录与贡献者（点击展开）</summary>

  footer: |
    </details>

builds:
  - id: multica
    main: ./cmd/multica
    dir: server
    binary: multica
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.buildCommit={{.FullCommit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # Legacy archive name kept so already-released CLIs (whose `multica update`
  # looks for `multica_{os}_{arch}.{ext}`) can keep self-updating. Remove
  # once those versions are no longer in use.
  - id: legacy
    files:
      - LICENSE*
      - README*
      - NOTICE
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
  # Versioned archive name used by current CLI / install scripts /
  # desktop bootstrap going forward.
  - id: versioned
    files:
      - LICENSE*
      - README*
      - NOTICE
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  # Only author logins should create contributor mentions, not product syntax
  # such as @all in commit subjects. Keep every commit so all authors get credit.
  format: '{{ .SHA }} {{ replace .Message "@" "@<!-- -->" }}{{ if .Logins }} ({{ .Logins | englishJoin }}){{ end }}'
  sort: asc
